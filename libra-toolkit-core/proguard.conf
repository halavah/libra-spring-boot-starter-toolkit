# ========================================
# ProGuard 混淆配置
# Libra Spring Boot Starter Toolkit
# ========================================

# ---------------------------------
# 基础配置
# ---------------------------------

# 不忽略警告（确保所有问题都被发现）
-dontwarn

# 保留源文件名和行号（用于调试，生产环境可删除）
-keepattributes SourceFile,LineNumberTable

# 保留注解
-keepattributes *Annotation*

# 保留泛型信息
-keepattributes Signature

# 保留异常信息
-keepattributes Exceptions

# 保留内部类信息
-keepattributes InnerClasses

# ---------------------------------
# 保留公共 API（不混淆）
# ---------------------------------

# 保留所有 public 类的 public 方法
-keep public class * {
    public protected *;
}

# 保留所有枚举
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# 保留所有序列化类
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# ---------------------------------
# 保留工具类的静态方法（核心）
# ---------------------------------

# 保留 DatabaseUtil 的所有 public 方法
-keep class cn.myslayers.libra.framework.toolkit.database.DatabaseUtil {
    public static *;
}

# 保留 DatabaseUtil 的内部类
-keep class cn.myslayers.libra.framework.toolkit.database.DatabaseUtil$* {
    public *;
}

# 保留 PostmanUtil 的所有 public 方法
-keep class cn.myslayers.libra.framework.toolkit.http.PostmanUtil {
    public static *;
}

# 保留 PostmanUtil 的内部类和注解
-keep class cn.myslayers.libra.framework.toolkit.http.PostmanUtil$* {
    public *;
}

# 保留 RedissonUtil 的所有 public 方法
-keep class cn.myslayers.libra.framework.toolkit.redis.RedissonUtil {
    public static *;
}

# ---------------------------------
# 保留 License 验证类（核心安全）
# ---------------------------------

# 保留 LicenseValidator 的所有内容（防止被混淆破坏验证逻辑）
-keep class cn.myslayers.libra.framework.toolkit.license.LicenseValidator {
    *;
}

# 保留 LicenseGenerator（开发工具，但保留以便生成 License）
-keep class cn.myslayers.libra.framework.toolkit.license.LicenseGenerator {
    public *;
}

# ---------------------------------
# 框架兼容性
# ---------------------------------

# Spring Boot
-keep class * extends org.springframework.boot.SpringApplication {
    public *;
}

-keep @org.springframework.stereotype.Component class * { *; }
-keep @org.springframework.stereotype.Service class * { *; }
-keep @org.springframework.stereotype.Repository class * { *; }
-keep @org.springframework.web.bind.annotation.RestController class * { *; }
-keep @org.springframework.context.annotation.Configuration class * { *; }

# Jackson
-keep class com.fasterxml.jackson.databind.** { *; }
-dontwarn com.fasterxml.jackson.databind.**

# Hutool
-keep class cn.hutool.** { *; }
-dontwarn cn.hutool.**

# Lombok（生成的方法需要保留）
-keep class lombok.** { *; }
-dontwarn lombok.**

# HikariCP
-keep class com.zaxxer.hikari.** { *; }
-dontwarn com.zaxxer.hikari.**

# Lettuce
-keep class io.lettuce.core.** { *; }
-dontwarn io.lettuce.core.**

# Redisson
-keep class org.redisson.** { *; }
-dontwarn org.redisson.**

# JSqlParser
-keep class net.sf.jsqlparser.** { *; }
-dontwarn net.sf.jsqlparser.**

# MySQL Driver
-keep class com.mysql.cj.jdbc.** { *; }
-dontwarn com.mysql.cj.jdbc.**

# ---------------------------------
# 反射和动态加载
# ---------------------------------

# 保留被反射调用的类
-keepclassmembers class * {
    @java.lang.reflect.* *;
}

# 保留 JDBC 驱动
-keep class * implements java.sql.Driver {
    *;
}

# 保留 native 方法
-keepclasseswithmembernames class * {
    native <methods>;
}

# ---------------------------------
# 混淆策略（核心业务逻辑）
# ---------------------------------

# 混淆除了上述 keep 规则外的所有代码
# 这会混淆：
# - 所有 private/protected 方法
# - 所有内部实现细节
# - 所有非公共 API

# 使用更激进的混淆算法
-overloadaggressively

# 合并包名（增强混淆效果）
-flattenpackagehierarchy ''
-repackageclasses ''

# 允许访问修饰符变更（增强混淆）
-allowaccessmodification

# 使用混合大小写类名
-useuniqueclassmembernames

# ---------------------------------
# 优化选项
# ---------------------------------

# 不做预校验（加快构建）
-dontpreverify

# 进行优化（可能提升性能）
-optimizations !code/simplification/arithmetic,!field/*,!class/merging/*

# 优化次数
-optimizationpasses 5

# ---------------------------------
# 输出映射文件（重要！）
# ---------------------------------

# 生成混淆映射文件（用于还原堆栈）
-printmapping proguard-mapping.txt

# 生成种子文件
-printseeds proguard-seeds.txt

# 生成配置文件
-printconfiguration proguard-config.txt

# ---------------------------------
# 日志输出
# ---------------------------------

# 详细输出
-verbose
