name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build
      run: mvn clean compile -q -DskipTests
    - name: Package
      run: mvn package -q -DskipTests
    - name: Verify artifacts
      run: |
        jar=$(find . -path "*/target/*.jar" -not -name "*-sources.jar" | head -1)
        if [ -z "$jar" ]; then echo "No JAR found"; exit 1; fi
        echo "Built: $jar"
